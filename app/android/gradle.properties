# -Xmx abaissé de 8G à 3G le 2026-08-31 : sur cette machine (14Gi de RAM),
# 8G épuisait tout le swap disponible et faisait planter/traîner le daemon
# Gradle (crash "daemon disappeared" au premier essai du build de
# collaboration, puis un deuxième essai qui thrashait pendant 25+ minutes
# sans jamais aboutir) — trouvé en surveillant la mémoire pendant le build.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
